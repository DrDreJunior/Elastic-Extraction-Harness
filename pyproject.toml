[project]
name = "elastic-extraction-harness"
version = "1.0.0"
description = "Resilient LLM extraction harness with self-repair loop and human-review fallback."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2.6,<3.0",
    "uvicorn[standard]>=0.29,<1.0",
    "openai>=1.30,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pip-tools>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app", "tests", "examples"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, undefined names, etc.)
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
# The harness intentionally uses broad except to honour its never-raise contract.
ignore = ["E501", "B904", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "F401"]

[tool.mypy]
python_version = "3.10"
files = ["app", "examples"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
disallow_untyped_defs = false
allow_redefinition = true
